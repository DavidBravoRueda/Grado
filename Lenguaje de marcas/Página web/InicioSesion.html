<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Autosveloz</title>
    <link rel="stylesheet" href="CSS/estilosinicio.css">
</head>
<body>
    <main>
        <div class="login-contenedor">
            <a href="index.html">
                <img id="Logo" src="Imagenes/Logo con Tipografía para Iniciales del Nombre Profesional Circular Limpio Elegante Blanco Negro-2.png"/>
            </a>
            <h2>Iniciar Sesión</h2>
            <form>
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required>
                <button type="submit">Iniciar Sesión</button>
            </form>
            <p>¿No tienes una cuenta? <a href="registro.html">Regístrate</a></p>
        </div>
    </main>
    <script src="JavaScripts/iniciosesion.js"></script>
</body>
</html>
