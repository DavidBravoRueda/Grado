<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Autosveloz</title>
    <link rel="stylesheet" href="CSS/estilosregistro.css">
</head>
<body>
    <main>
        <div class="registrar-contenedor">
            <a href="index.html">
                <img src="Imagenes/Logo con Tipografía para Iniciales del Nombre Profesional Circular Limpio Elegante Blanco Negro-2.png" alt="Logo" style="width: 150px; margin-bottom: 20px;">
            </a>
            <h2>Registrarse</h2>
            <form id="registro-form" method="POST" novalidate>
                <div class="form-control">
                    <label for="username">Usuario:</label>
                    <input type="text" id="username" name="username" required>
                    <span class="input-status"></span> <!-- Nuevo contenedor para el estado del campo -->
                </div>
                <div class="form-control">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                    <span class="input-status"></span> <!-- Nuevo contenedor para el estado del campo -->
                </div>
                <div class="form-control">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                    <span class="input-status"></span> <!-- Nuevo contenedor para el estado del campo -->
                </div>
                <div class="form-control">
                    <label for="confirm-password">Confirmar Contraseña:</label>
                    <input type="password" id="confirm-password" name="confirm-password" required>
                    <span class="input-status"></span> <!-- Nuevo contenedor para el estado del campo -->
                </div>
                <div class="form-control" id="aceptar">
                    <input type="checkbox" id="privacy-policy" required>
                    <label for="privacy-policy">He leído y acepto la política de privacidad</label>
                    <span class="validity"></span>
                </div>
                <button type="submit">Registrarse</button>
            </form>
            <p>¿Ya tienes una cuenta? <a href="InicioSesion.html">Iniciar Sesión</a></p>
        </div>
    </main>
    <script src="JavaScripts/registro.js"></script>
</body>
</html>
